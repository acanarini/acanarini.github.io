- name: Arun Kumar Devarajan
  photo: Arun.png
  info: Postdoc, started July 2025. My research interests focus on understanding how climate change and environmental stressors regulate microbial responses and their feedbacks to ecosystem processes. My PhD research investigated how warming magnitude and duration alter bacterial community structure and nitrogen cycling potential. Currently, as a postdoctoral researcher in the ERC project EcoMEMO at the University of Bologna, I study how precipitation history shapes soil microbial drought responses and their biogeochemical cycling potential in Mediterranean ecosystems.
