- name: Prof. Feike A. Dijkstra
  info: Visiting Professor, started July 2026. Feike is a Professor at the University of Sydney and leads its Terrestrial Biogeochemistry Laboratory. His research examines how climate and land-use change affect carbon, nutrient and water dynamics in terrestrial ecosystems, with a focus on plant–microbe–soil interactions in grasslands and agroecosystems using field, laboratory and stable-isotope experiments.
  email: feike.dijkstra@sydney.edu.au
  website: https://profiles.sydney.edu.au/feike.dijkstra

