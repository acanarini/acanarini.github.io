name: Build and publish website

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: micso-website-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download the website source
        uses: actions/checkout@v4

      - name: Prepare Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install the website builder
        run: bundle install --jobs 4 --retry 3

      - name: Build the website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Publish the generated pages
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -a _site/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"

          cd "$publish_dir"
          git init --initial-branch=master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish website from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" master
